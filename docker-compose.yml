services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samra-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://admin:admin123@mongo:27017/samra?authSource=admin&replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-samra-dev-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_GUEST_EXPIRES_IN: ${JWT_GUEST_EXPIRES_IN:-7d}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@samra.com}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth

  mongo:
    image: mongo:7
    container_name: samra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: samra
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/data/keyfile:ro
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/keyfile"]
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })
        }" | mongosh -u admin -p admin123 --authenticationDatabase admin --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 10s
      retries: 10

volumes:
  mongo_data:
