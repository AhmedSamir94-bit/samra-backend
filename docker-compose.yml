services:
  mongo:
    image: mongo:7
    container_name: samra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: samra
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/data/keyfile:ro
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/keyfile"]
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })
        }" | mongosh -u admin -p admin123 --authenticationDatabase admin --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 10s
      retries: 10

volumes:
  mongo_data:
